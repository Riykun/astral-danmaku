<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090c1d"><title>ASTRAL / 弾幕幻想</title><style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b18;color:#e8e9f4;font-family:'Zen Kaku Gothic New',sans-serif;overflow:hidden}body{display:grid;place-items:center}.shell{height:100dvh;width:min(100vw,660px);position:relative;background:#0a1022;overflow:hidden;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;letter-spacing:.18em;font-size:10px;color:#b6bedb;z-index:3}.logo{font-family:'Shippori Mincho B1',serif;letter-spacing:.22em;color:#f2e9ff}.stats{display:flex;gap:20px}.stat span{display:block;color:#667294;font-size:9px;letter-spacing:.15em}.stat b{font-size:15px;letter-spacing:.04em;font-weight:500;color:#eef0ff}.frame{flex:1;position:relative;margin:0 12px 12px;border:1px solid #313c5b;border-radius:5px;overflow:hidden;background:#080d1d;box-shadow:0 0 0 1px #121a30,0 20px 80px #0008}.frame:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b1029 0%,transparent 22%,transparent 75%,#070a16 100%);z-index:1}.frame canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#151c39d9,#070a15ed 76%);text-align:center;padding:25px}.overlay.hidden{display:none}.titlejp{font:600 clamp(24px,6vw,42px) 'Shippori Mincho B1',serif;letter-spacing:.32em;margin:0 0 10px}.subtitle{font-size:10px;color:#95a2ca;letter-spacing:.32em;margin-bottom:40px}.rule{width:70px;height:1px;background:linear-gradient(90deg,transparent,#b4a2ed,transparent);margin:20px auto}.lead{font-size:11px;color:#b9c3df;line-height:2.1;letter-spacing:.1em;margin:0 0 24px}.button{border:1px solid #8e86bb;background:#141a31;color:#f0eaff;padding:13px 34px;font-family:inherit;letter-spacing:.22em;font-size:12px;cursor:pointer;transition:.2s}.button:hover{background:#272443;border-color:#d2baff}.minor{font-size:10px;color:#7280a6;margin-top:22px;letter-spacing:.12em}.hudboss{position:absolute;z-index:2;left:7%;right:7%;top:5%;pointer-events:none}.bossname{font:14px 'Shippori Mincho B1',serif;letter-spacing:.18em}.bosstitle{font-size:9px;color:#9ba8ca;letter-spacing:.2em;margin-top:4px}.hp{height:3px;background:#343b5d;margin-top:12px;position:relative}.hp>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#9b7ae9,#f1c6fa);transition:width .15s}.msg{position:absolute;top:24%;width:100%;text-align:center;z-index:3;font:18px 'Shippori Mincho B1',serif;letter-spacing:.3em;color:#eee3ff;text-shadow:0 0 20px #9a7beb;pointer-events:none}.bottom{display:flex;justify-content:space-between;padding:0 20px 12px;font-size:9px;color:#6e7897;letter-spacing:.14em}.touch{position:absolute;z-index:4;inset:auto 0 4%;display:none;justify-content:space-between;align-items:end;padding:0 5%;pointer-events:none}.pad,.actions{pointer-events:auto;display:flex;gap:8px}.touch button{border:1px solid #a5acd04a;background:#161d35bb;color:#cfd8f6;border-radius:50%;width:55px;height:55px;font:11px inherit;letter-spacing:.08em;touch-action:none;backdrop-filter:blur(5px)}.touch button:active{background:#6c579d99}.actions{flex-direction:column}.actions button{width:48px;height:48px}.pause{position:absolute;z-index:5;top:12px;right:12px;border:1px solid #4b5374;background:#121a30aa;color:#d8ddf2;font:11px inherit;letter-spacing:.1em;padding:8px 12px;display:none}.pause.visible{display:block}@media(min-width:700px){.touch{display:none!important}}@media(max-height:600px){.top{padding:7px 12px}.bottom{padding-bottom:6px}.lead{margin-bottom:12px}.subtitle{margin-bottom:18px}}
</style></head><body><main class="shell"><header class="top"><div class="logo">ASTRAL</div><div class="stats"><div class="stat"><span>SCORE</span><b id="score">000000</b></div><div class="stat"><span>STAGE</span><b id="stage">01</b></div><div class="stat"><span>STAGE</span><b id="stage">01</b></div><div class="stat"><span>残機</span><b id="lives">03</b></div><div class="stat"><span>霊力</span><b id="bombs">02</b></div></div></header><section class="frame"><canvas id="game"></canvas><div class="hudboss" id="bossHud" style="display:none"><div class="bossname" id="bossName">夜巡の星詠み</div><div class="bosstitle" id="phase">PHASE 01 / 星の雨</div><div class="hp"><i id="hp"></i></div></div><div class="msg" id="message"></div><button class="pause" id="pause">PAUSE</button><div class="overlay" id="menu"><div><div class="subtitle">ORIGINAL VERTICAL DANMAKU</div><h1 class="titlejp">星影の巡礼</h1><div class="rule"></div><p class="lead">夜空に散る星々を抜け、<br>星詠みの主へ辿り着け。</p><button class="button" id="start" type="button">ゲーム開始</button><div class="minor">移動　矢印 / WASD　・　低速　SHIFT　・　霊撃　X</div></div></div><div class="overlay hidden" id="stageClear"><div><div class="subtitle">STAGE CLEAR</div><h2 class="titlejp" id="stageClearTitle">星屑の回廊</h2><div class="rule"></div><p class="lead" id="stageClearText">次の星域へ進もう。</p><button class="button" id="nextStage" type="button">NEXT STAGE</button></div></div><div class="overlay hidden" id="end"><div><div class="subtitle" id="endcap">STAGE COMPLETE</div><h2 class="titlejp" id="endtitle">星空に帰還</h2><div class="rule"></div><p class="lead" id="endtext">戦いの記録</p><button class="button" id="retry">もう一度プレイ</button></div></div><div class="touch" id="touch"><div class="pad"><button id="move" aria-label="移動">移動</button></div><div class="actions"><button id="slow">低速</button><button id="bomb">霊撃</button></div></div></section><footer class="bottom"><span>STARDUST PROTOCOL</span><span>ESC / P　PAUSE</span></footer></main><script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=480,H=820;let scale=1;function resize(){let r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));scale=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2)}new ResizeObserver(resize).observe(canvas);resize();
const $=id=>document.getElementById(id),menu=$('menu'),end=$('end'),hud=$('bossHud'),pauseBtn=$('pause');let mode='title',paused=false,score=0,stage=1,lives=3,bombs=2,t=0,last=0,shake=0,keys={},slow=false,fireTimer=0,patternTimer=0,phase=0,bossHp=1,particles=[],bullets=[],enemyBullets=[],stars=[],player={x:240,y:690,r:5,inv:0},boss={x:240,y:160,r:42};let touchMove={x:0,y:0},pointerActive=false;const stageNames=['星屑の回廊','月影の領域','蒼天の残響','紅蓮の天球','虚空の境界','星詠みの終焉'];
for(let i=0;i<170;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*1.8,s:.3+Math.random()*1.4});
function reset(){mode='play';paused=false;score=0;stage=1;lives=3;bombs=2;phase=0;bossHp=1;t=0;bullets=[];enemyBullets=[];particles=[];player={x:240,y:690,r:5,inv:130};boss={x:240,y:160,r:42};patternTimer=0;fireTimer=0;updateHud();menu.classList.add('hidden');end.classList.add('hidden');$('stageClear').classList.add('hidden');hud.style.display='block';pauseBtn.classList.add('visible');$('message').textContent='';}
function updateHud(){$('score').textContent=String(score).padStart(6,'0');$('stage').textContent=String(stage).padStart(2,'0');$('lives').textContent=String(lives).padStart(2,'0');$('bombs').textContent=String(bombs).padStart(2,'0');$('hp').style.width=Math.max(0,bossHp*100)+'%';$('bossName').textContent=stageNames[stage-1];$('phase').textContent=phase===0?'PHASE 01 / 星の雨':phase===1?'PHASE 02 / 夜光の輪':'PHASE 03 / 天球の崩落';}
function circle(x,y,r,color,glow=0){ctx.save();ctx.shadowBlur=glow;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:20+Math.random()*20,color,r:1+Math.random()*2})}}
function shot(x,y,vx,vy,r=5,color='#f5baff',damage=1){enemy_bullet(x,y,vx,vy,r,color,damage)}function enemy_bullet(x,y,vx,vy,r,color,damage=1){enemyBullets.push({x,y,vx,vy,r,color,damage})}
function radial(n,speed,offset,color,r=5){for(let i=0;i<n;i++){let a=i*2*Math.PI/n+offset;shot(boss.x,boss.y,Math.cos(a)*speed,Math.sin(a)*speed,r,color)}}
function aimedSpread(n,spread,speed,color){let a=Math.atan2(player.y-boss.y,player.x-boss.x);for(let i=0;i<n;i++){let aa=a+(i-(n-1)/2)*spread;shot(boss.x,boss.y,Math.cos(aa)*speed,Math.sin(aa)*speed,5,color)}}
function movePlayer(dt){let speed=slow||keys.Shift?2.3:4.3;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+(touchMove.x||0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+(touchMove.y||0);let len=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(W-20,player.x+dx/len*speed));player.y=Math.max(35,Math.min(H-30,player.y+dy/len*speed));if(player.inv>0)player.inv=Math.max(0,player.inv-dt/16);
if(++fireTimer>7){fireTimer=0;bullets.push({x:player.x-7,y:player.y-14,vy:-9,r:3,color:'#b4f3ff'},{x:player.x+7,y:player.y-14,vy:-9,r:3,color:'#b4f3ff'});if(slow){bullets.push({x:player.x,y:player.y-19,vy:-11,r:3.5,color:'#fff2b2'})}}
}
function bombUse(){if(mode!=='play'||paused||bombs<=0)return;bombs--;bossHp=Math.max(0,bossHp-.17);enemyBullets=[];burst(player.x,player.y,'#d9b6ff',50);shake=15;updateHud()}
function hit(){if(player.inv>0)return;lives--;player.inv=110;shake=12;burst(player.x,player.y,'#b9f8ff',24);updateHud();if(lives<=0){finish(false);return}}
function finish(win){mode='end';pauseBtn.classList.remove('visible');hud.style.display='none';$('endcap').textContent=win?'ALL PHASES CLEARED':'GAME OVER';$('endtitle').textContent=win?'星空に帰還':'星はまだ遠い';$('endtext').textContent=win?'スコア '+String(score).padStart(6,'0')+'　星巡りの記録を刻んだ。':'スコア '+String(score).padStart(6,'0')+'　再び星の海へ挑もう。';end.classList.remove('hidden')}
function togglePause(){if(mode!=='play')return;paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';$('message').textContent=paused?'PAUSED':''}
function update(dt){t+=dt;stars.forEach(s=>{s.y+=s.z*dt*.035;if(s.y>H)s.y=0});if(mode!=='play'||paused)return;movePlayer(dt);patternTimer+=dt;boss.x=240+Math.sin(t*.0008)*125;boss.y=140+Math.sin(t*.0013)*24;
if(phase===0){if(patternTimer%Math.max(400,850-stage*60)<dt){radial(22+stage*2,2.2+stage*.12,patternTimer*.001,'#f1aaff',5)}if(patternTimer%1150<dt)aimedSpread(7+stage,.14,2.7+stage*.08,'#7ee8ff');}
else if(phase===1){if(patternTimer%Math.max(340,560-stage*35)<dt)radial(30+stage*2,2.6+stage*.1,patternTimer*.0014,'#89e9ff',5);if(patternTimer%900<dt)aimedSpread(11+stage,.11,2.5+stage*.07,'#ffb4dc');}else{if(patternTimer%410<dt)radial(36,3.0,patternTimer*.0018,'#f9c2ff',5);if(patternTimer%700<dt)aimedSpread(13,.095,2.9,'#9df5ff');if(patternTimer%1300<dt){for(let k=0;k<4;k++)radial(16,2.0+k*.25,patternTimer*.001+k*.0,'#ffdc9c',4)}}
// Shooting hit checks
bullets.forEach(b=>{b.y+=b.vy*dt/16;if(Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+5){b.dead=true;bossHp-=.012;score+=15;burst(b.x,b.y,'#c5ffff',3)}});bullets=bullets.filter(b=>!b.dead&&b.y>-20);if(bossHp<=0){if(phase<2){phase++;patternTimer=0;bossHp=phase===1?.68:.35;enemyBullets=[];burst(boss.x,boss.y,'#c9a9ff',40);updateHud()}else{if(stage<6){mode='intermission';stage++;phase=0;bossHp=1;patternTimer=0;fireTimer=0;bullets=[];enemyBullets=[];bombs=Math.min(3,bombs+1);player.inv=150;burst(boss.x,boss.y,'#c9a9ff',70);updateHud();$('stageClearTitle').textContent=stageNames[stage-2];$('stageClearText').textContent='次の星域：'+stageNames[stage-1]+'　霊力を1つ補充。';$('stageClear').classList.remove('hidden')}else{finish(true);return}}}
enemyBullets.forEach(b=>{b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;if(b.y>H+30||b.y<-40||b.x<-30||b.x>W+30)b.dead=true;if(player.inv<=0&&Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r+3){b.dead=true;hit()}});enemyBullets=enemyBullets.filter(b=>!b.dead);
particles.forEach(p=>{p.x+=p.vx*dt*.04;p.y+=p.vy*dt*.04;p.life-=dt*.035});particles=particles.filter(p=>p.life>0);if(shake>0)shake-=dt*.04;
}
function draw(){ctx.clearRect(0,0,W,H);let sx=shake?Math.random()*shake-shake/2:0,sy=shake?Math.random()*shake-shake/2:0;ctx.save();ctx.translate(sx,sy);
// deep nebula backdrop
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111b39');g.addColorStop(.48,'#090e23');g.addColorStop(1,'#070b19');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let q=0;q<4;q++){ctx.save();ctx.globalAlpha=.07;ctx.translate(100+q*95,170+q*180);ctx.rotate(t*.0001*(q%2?1:-1));let rg=ctx.createRadialGradient(0,0,20,0,0,190);rg.addColorStop(0,q%2?'#a66fe9':'#4a91c9');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(-200,-200,400,400);ctx.restore()}
stars.forEach(s=>{ctx.fillStyle=`rgba(201,218,255,${.15+s.z*.27})`;ctx.fillRect(s.x,s.y,s.s,s.s)});
// delicate celestial circles
ctx.strokeStyle='#9aabdf12';ctx.lineWidth=1;for(let r=130;r<480;r+=85){ctx.beginPath();ctx.arc(W/2,H*.38,r,0,Math.PI*2);ctx.stroke()}
if(mode==='play'||mode==='end'){// boss orb with stylized star-wing shape
ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(t*.00035);ctx.strokeStyle='#a998e77a';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,0,65,28,0,0,Math.PI*2);ctx.stroke()}ctx.restore();let bg=ctx.createRadialGradient(boss.x,boss.y,3,boss.x,boss.y,56);bg.addColorStop(0,'#fff4ff');bg.addColorStop(.2,'#cfb3ff');bg.addColorStop(.6,'#7057ba');bg.addColorStop(1,'#191d3d00');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(boss.x,boss.y,55,0,6.28);ctx.fill();ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(-t*.0005);ctx.strokeStyle='#f2d8ff';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=i%2?19:39;let x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}
bullets.forEach(b=>{circle(b.x,b.y,b.r,b.color,9)});enemyBullets.forEach(b=>{ctx.save();ctx.translate(b.x,b.y);ctx.rotate(t*.001);ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,-b.r*1.7);ctx.lineTo(b.r*.7,0);ctx.lineTo(0,b.r*1.7);ctx.lineTo(-b.r*.7,0);ctx.closePath();ctx.fill();ctx.restore()});particles.forEach(p=>circle(p.x,p.y,p.r*p.life/30,p.color,8));
// Player winged spirit
if(mode==='play'){ctx.save();ctx.translate(player.x,player.y);if(player.inv&&Math.floor(player.inv/5)%2===0)ctx.globalAlpha=.45;let plg=ctx.createLinearGradient(0,-24,0,16);plg.addColorStop(0,'#f7ffff');plg.addColorStop(.5,'#8ee7f8');plg.addColorStop(1,'#6881c7');ctx.fillStyle=plg;ctx.shadowColor='#8be9ff';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(7,1);ctx.lineTo(0,13);ctx.lineTo(-7,1);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e5ffff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-4,-2);ctx.quadraticCurveTo(-17,-16,-13,2);ctx.quadraticCurveTo(-9,10,-3,5);ctx.moveTo(4,-2);ctx.quadraticCurveTo(17,-16,13,2);ctx.quadraticCurveTo(9,10,3,5);ctx.stroke();circle(0,3,2.4,'#fff5ba',10);if(slow){ctx.strokeStyle='#e8faff66';ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.stroke()}ctx.restore()}
ctx.restore();requestAnimationFrame(draw)}
function frame(now){let dt=Math.min(40,now-last||16);last=now;update(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);requestAnimationFrame(draw);
$('start').onclick=reset;$('retry').onclick=reset;$('nextStage').onclick=()=>{if(mode!=='intermission')return;mode='play';paused=false;$('stageClear').classList.add('hidden');boss={x:240,y:160,r:42};player.inv=100;updateHud();$('message').textContent='';};pauseBtn.onclick=togglePause;document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='x')bombUse();if(e.key.toLowerCase()==='p'||e.key==='Escape')togglePause()});document.addEventListener('keyup',e=>keys[e.key]=false);
function touchHold(id,fn){let el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn(true)},{passive:false});el.addEventListener('touchend',()=>fn(false));el.addEventListener('touchcancel',()=>fn(false));el.addEventListener('mousedown',()=>fn(true));el.addEventListener('mouseup',()=>fn(false));el.addEventListener('mouseleave',()=>fn(false))}touchHold('slow',v=>slow=v);touchHold('bomb',v=>{if(v)bombUse()});let pad=$('move');pad.style.touchAction='none';pad.addEventListener('pointerdown',e=>{e.preventDefault();pointerActive=true;pad.setPointerCapture?.(e.pointerId);setMove(e) });pad.addEventListener('pointermove',e=>{if(pointerActive)setMove(e)});pad.addEventListener('pointerup',()=>{pointerActive=false;touchMove={x:0,y:0}});pad.addEventListener('pointercancel',()=>{pointerActive=false;touchMove={x:0,y:0}});function setMove(e){let r=pad.getBoundingClientRect();touchMove.x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2)));touchMove.y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)))}let canvas=$('game');canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{if(mode!=='play'||paused)return;audioUnlock();pointerActive=true;canvas.setPointerCapture?.(e.pointerId);moveToPointer(e)});canvas.addEventListener('pointermove',e=>{if(pointerActive)moveToPointer(e)});canvas.addEventListener('pointerup',()=>pointerActive=false);canvas.addEventListener('pointercancel',()=>pointerActive=false);function moveToPointer(e){let r=canvas.getBoundingClientRect(),scaleX=W/r.width,scaleY=H/r.height;player.x=Math.max(20,Math.min(W-20,(e.clientX-r.left)*scaleX));player.y=Math.max(35,Math.min(H-30,(e.clientY-r.top)*scaleY));touchMove={x:0,y:0}}$('start').addEventListener('pointerdown',audioUnlock,{once:true})
})();</script></body></html>
